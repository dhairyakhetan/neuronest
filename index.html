<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroNest — Every Mind Matters. Every Milestone Counts.</title>
    <meta name="description" content="NeuroNest is an AI-powered support ecosystem for neurodiverse families — check your child's development, connect with therapists and other parents, and celebrate every milestone with daily activities and rewards." />
    <meta name="theme-color" content="#FCFAF5" />
    <link rel="canonical" href="https://neuronest-official.vercel.app/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NeuroNest" />
    <meta property="og:url" content="https://neuronest-official.vercel.app/" />
    <meta property="og:title" content="NeuroNest — Every Mind Matters. Every Milestone Counts." />
    <meta property="og:description" content="AI-powered support for neurodiverse families: development checks that flag delays early, therapist connect, a parent community, and daily rewards — all in one app." />
    <meta property="og:image" content="https://neuronest-official.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NeuroNest — Every Mind Matters. Every Milestone Counts." />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NeuroNest — Every Mind Matters. Every Milestone Counts." />
    <meta name="twitter:description" content="AI-powered support for neurodiverse families: development checks, therapist connect, parent community and daily rewards." />
    <meta name="twitter:image" content="https://neuronest-official.vercel.app/og-image.png" />

    <script>
      try {
        var t = localStorage.getItem('neuronest:theme');
        var dark = t === '"dark"' || (t === '"system"' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
